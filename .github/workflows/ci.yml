name: Rust runtime checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    strategy:
      matrix:
        rust: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        if: matrix.rust == 'stable'
        run: cargo +stable fmt --all -- --check
      - name: Lint all targets
        run: cargo +${{ matrix.rust }} clippy --all-targets --all-features --locked -- -D warnings
      - name: Unit and contract tests
        run: cargo +${{ matrix.rust }} test --all-targets --locked
      # One release build is enough as a compile check; it is the slowest step
      # in the job (fat LTO, one codegen unit), so skip it on the second leg.
      - name: Build release executable
        if: matrix.rust == '1.85.0'
        run: cargo +${{ matrix.rust }} build --release --locked
