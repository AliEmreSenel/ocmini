[package]
name = "ocmini-web"
version.workspace = true
edition = "2021"
rust-version = "1.85"

[dependencies]
ocmini-core = { path = "../ocmini-core", default-features = false }
ocmini-server = { path = "../ocmini-server" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
