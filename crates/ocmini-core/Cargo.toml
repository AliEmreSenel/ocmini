[package]
name = "ocmini-core"
version.workspace = true
edition = "2021"
rust-version = "1.85"

[features]
default = ["sandbox"]
sandbox = ["dep:ocmini-sandbox"]

[dependencies]
ocmini-tools = { path = "../ocmini-tools" }
ocmini-sandbox = { path = "../ocmini-sandbox", optional = true }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
rand = "0.9"
base64 = "0.22"
regex = "1"
glob = "0.3"
walkdir = "2"
async-trait = "0.1"
async-stream = "0.3"
libc = "0.2"
serde_json_lenient = "0.2.4"
tempfile = "3.27.0"
yaml_serde = "0.10.7"
unicode-width = "0.2"


[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["test-util"] }
