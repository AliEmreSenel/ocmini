[package]
name = "ocmini"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
tokio-util = "0.7"
rand = "0.9"
base64 = "0.22"
glob = "0.3"
walkdir = "2"
regex = "1"
async-trait = "0.1"
async-stream = "0.3"
crossterm = "0.28"
chrono = "0.4"

[[bin]]
name = "ocmini"
path = "src/main.rs"

[[bin]]
name = "ocmini-fuzz"
path = "src/bin/fuzz.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
