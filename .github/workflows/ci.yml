name: Rust runtime checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint all targets
        run: cargo +stable clippy --all-targets --locked -- -D warnings
      - name: Unit and contract tests
        run: cargo +stable test --all-targets --locked
      - name: Build release executable
        run: cargo +stable build --release --locked
