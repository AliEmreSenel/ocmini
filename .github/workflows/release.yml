name: Release binaries

# Tag a commit as vX.Y.Z (matching Cargo.toml) and this publishes prebuilt
# executables on the GitHub Release: Linux (x86_64 glibc + musl, ARM64,
# ARMv7 and ARMv6 hard-float), macOS (Apple silicon) and Windows (x86_64).
# ARMv7/ARMv6 use cross containers for bundled SQLite's C toolchain; other targets
# build natively. Binaries are unsigned: macOS users must clear the Gatekeeper
# quarantine (`xattr -d com.apple.quarantine ocmini`); Windows shows SmartScreen.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            builder: cargo
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            builder: cargo
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            builder: cargo
          - os: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            builder: cross
          - os: ubuntu-24.04
            target: arm-unknown-linux-gnueabihf
            builder: cross
          - os: macos-14
            target: aarch64-apple-darwin
            builder: cargo
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            builder: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the package version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || { echo "::error::tag v$tag but Cargo.toml says $version"; exit 1; }

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.builder == 'cross'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cross"
          curl --fail --location --retry 3 https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$RUNNER_TEMP/cross"
          echo "$RUNNER_TEMP/cross" >> "$GITHUB_PATH"

      - run: ${{ matrix.builder }} build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="ocmini-$version-${{ matrix.target }}"
          bin=ocmini
          ext=tar.gz
          if [ "$RUNNER_OS" = Windows ]; then bin=ocmini.exe; ext=zip; fi
          mkdir -p pkg/bin
          cp "target/${{ matrix.target }}/release/$bin" pkg/bin/
          cp README.md pkg/
          cp -R docs pkg/docs
          if [ "$RUNNER_OS" = Windows ]; then
            python -c 'import shutil, sys; shutil.make_archive(sys.argv[1], "zip", "pkg")' "$name"
          else
            tar -czf "$name.$ext" -C pkg bin README.md docs
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "$name.$ext" > "$name.$ext.sha256"
          else
            sha256sum "$name.$ext" > "$name.$ext.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ocmini-*.*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes artifacts/*
