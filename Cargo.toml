[package]
name = "ocmini"
version.workspace = true
edition = "2021"
rust-version = "1.85"
resolver = "3"

[workspace]
members = ["crates/ocmini-tools", "crates/ocmini-sandbox", "crates/ocmini-core", "crates/ocmini-tui", "crates/ocmini-server", "crates/ocmini-web"]

[workspace.package]
version = "0.5.0"

[features]
default = ["sandbox", "web"]
sandbox = ["ocmini-core/sandbox", "dep:ocmini-sandbox"]
# Browser interface served by `ocmini serve` (alias `ocmini web`).
web = ["dep:ocmini-web"]

[dependencies]
ocmini-sandbox = { path="crates/ocmini-sandbox", optional=true }
ocmini-core = { path = "crates/ocmini-core", default-features = false }
ocmini-tui = { path = "crates/ocmini-tui" }
ocmini-server = { path = "crates/ocmini-server" }
ocmini-web = { path = "crates/ocmini-web", optional = true }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
rusqlite = { version="0.32", features=["bundled"] }
libc = "0.2"
async-stream = "0.3"
axum = "0.8"
serde_json = "1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"
base64 = "0.22"

[[bin]]
name = "ocmini"
path = "src/main.rs"

# Standalone sandbox runner; installed with ocmini by `cargo install --path .`.
[[bin]]
name = "ocmini-sandbox"
path = "src/bin/ocmini-sandbox.rs"
required-features = ["sandbox"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
